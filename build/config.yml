# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Otis" # The name of the company
  productName: "Otis" # The name of the application
  # Reverse-DNS of the GitHub organisation. Must not change once there are
  # installs: macOS keys the .http file association and the user's
  # default-application choice on it. Kept in step with appIdentifier in
  # main.go, which is also the single-instance lock's ID.
  productIdentifier: "io.github.otis-http.otis"
  description: "File-based HTTP client" # The application description
  copyright: "© 2026 Otis" # Copyright text
  comments: "Otis" # Comments
  version: "0.1.0" # The application version
  # Deliberately empty. It names an icon inside a macOS 26 Assets.car asset
  # catalogue, and Otis ships none — see the note in build/Taskfile.yml's
  # generate:icons. Left set, Info.plist would claim an asset that is not in
  # the bundle; macOS would fall back to CFBundleIconFile and draw the right
  # icon anyway, but the manifest would be describing something absent.
  cfBundleIconName: ""

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.1.0"
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#   # Additional comments to embed in Info.plist metadata
#   comments: "Otis"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
#
# The .http file, which is Otis' whole on-disk format (docs/FORMAT.md §1).
# Double-clicking one opens the collection around it and shows that request;
# main.go's ApplicationOpenedWithFile handler and CollectionService.OpenPath
# are the other end.
#
# role Editor, not Viewer: Otis writes the file back (docs/FORMAT.md §1.13).
#
# The MIME type is text/x-http, the name the format goes by in the editors
# that already read it, and it is registered as a subclass of text/plain on
# Linux (build/linux/otis-http.xml) so a .http file stays openable in a text
# editor. Otis does not claim to be the only thing that reads one — the
# JetBrains HTTP Client and the VS Code REST Client read the same files, and
# the point of the format is that they can.
fileAssociations:
  - ext: http
    name: HTTP request
    description: Otis HTTP request file
    iconName: httpFileIcon
    role: Editor
    mimeType: text/x-http

# Other data
other:
  - name: My Other Data